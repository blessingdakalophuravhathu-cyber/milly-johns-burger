<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Montserrat', sans-serif;
background:#f4f4f4;
}

header{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#1F5E87;
padding:15px;

}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{

}

.container{

border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.container h2{
text-align:center;
color:#1F5E87;
margin-bottom:20px;
}

.option{
background:#eeeeee;
padding:15px;
margin:10px 0;
border-radius:8px;

}

.option:hover{

}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#F5A623;
color:white;
border:none;
font-size:18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#e49300;
}

#selected{
margin-top:15px;
font-weight:bold;
text-align:center;
color:#1F5E87;
}

footer{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

<header>
<h1>Milly John's Burgers</h1>
</header>

<nav>
<a href="index.html">Home</a>

<a href="enquiries.html">Enquiries</a>
</nav>

<div class="container">

<h2>Final Destination Burger</h2>

</div>

<div class="option" onclick="choose('Meal Small Fries + Drink - R105.00')">
Meal Small Fries + Drink - R105.00
</div>

<div class="option" onclick="choose('Meal Medium Fries + Drink - R116.50')">
Meal Medium Fries + Drink - R116.50
</div>

<div class="option" onclick="choose('Meal Large Fries + Drink - R125.00')">

</div>

</button>
