<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Toast and Bacon Order</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat, sans-serif;
background:#f4f4f4;
}

header{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#174866;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
text-decoration:underline;
}

.container{
max-width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:#1F5E87;
}

.option{
background:#eeeeee;
padding:15px;
margin:10px 0;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#dddddd;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#F5A623;
color:white;
border:none;
font-size:18px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e49300;
}

#selected{
margin-top:15px;
font-weight:bold;
text-align:center;
color:#1F5E87;
}

</style>
</head>

<body>

<header>
<h1>Milly John's Burgers</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="contact.html">Contact Us</a>
<a href="about.html">About Us</a>
<a href="enquiries.html">Enquiries</a>
</nav>

<div class="container">

<h2>Egg Toast and Bacon</h2>

<div class="option" onclick="choose('Egg Toast and Bacon Only - R38.00')">
Egg Toast and Bacon Only - R38.00
</div>

<div class="option" onclick="choose('Breakfast Small Eggs + Hot Beverage - R47.90')">
Breakfast Small Eggs + Hot Beverage - R47.90
</div>

<div class="option" onclick="choose('Breakfast Medium Eggs + Hot Beverage - R60.00')">
Breakfast Medium Eggs + Hot Beverage - R60.00
</div>

<div class="option" onclick="choose('Breakfast Large Eggs + Hot Beverage - R75.00')">
Breakfast Large Eggs + Hot Beverage - R75.00
</div>

<div id="selected">No option selected</div>

<button onclick="goCheckout()">Add To Cart & Checkout</button>

</div>

<script>

let item = "";

function choose(choice){

item = choice;

document.getElementById("selected").innerHTML =
"Selected: " + choice;

}

function goCheckout(){

if(item === ""){

alert("Please select an option first.");

}else{

localStorage.setItem("cartItem", item);

window.location.href = "checkout.html";

}

}

</script>

</body>
</html>
