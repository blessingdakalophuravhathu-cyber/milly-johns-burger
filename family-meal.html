<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milly John's Family Meal Order</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Montserrat', sans-serif;
background:#f4f4f4;
}

header{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#1F5E87;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
text-decoration:underline;
}

.container{
max-width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.container h2{
text-align:center;
color:#1F5E87;
margin-bottom:20px;
}

.option{
background:#eeeeee;
padding:15px;
margin:10px 0;
border-radius:8px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
background:#dddddd;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#F5A623;
color:white;
border:none;
font-size:18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#e49300;
}

#selected{
margin-top:15px;
font-weight:bold;
text-align:center;
color:#1F5E87;
}

footer{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>
</head>

<body>

<header>
<h1>Milly John's Burgers</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="promotions.html">Promotions</a>
<a href="contact.html">Contact us</a>
<a href="about.html">About us</a>
<a href="enquiries.html">Enquiries</a>
</nav>

<div class="container">

<h2>Milly John's Family Meal</h2>

<div class="option" onclick="choose('Family Meal One - R180.00')">
Family Meal One - R180.00
</div>

<div class="option" onclick="choose('Family Meal Two - R235.90')">
Family Meal Two - R235.90
</div>

<div class="option" onclick="choose('Family Meal Three - R289.90')">
Family Meal Three - R289.90
</div>

<div class="option" onclick="choose('Family Meal Four - R319.90')">
Family Meal Four - R319.90
</div>

<div id="selected">
No option selected
</div>

<button onclick="goCheckout()">
Add To Cart & Checkout
</button>

</div>

<footer>
<p>&copy; 2026 Milly John's Burgers</p>
</footer>

<script>

let item = "";

function choose(choice){
item = choice;

document.getElementById("selected").innerHTML =
"Selected: " + choice;
}

function goCheckout(){

if(item==""){
alert("Please select an option first.");
}
else{
window.location.href="checkout.html";
}

}

</script>

</body>
</html>
