<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Order delicious Chocolate Milkshakes from Milly John's Burgers.">

<title>Chocolate Milkshake Order | Milly John's Burgers</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

/* BODY */
body{
margin:0;
font-family:'Montserrat',sans-serif;
background:#f4f7fb;
color:#333;
}

/* HEADER */
header{
background:white;
padding:25px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

header h1{
color:#F5A623;
margin:0;
font-size:42px;
}

/* NAVIGATION */
nav{
background:#1F5E87;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

nav a:hover{
color:#F5A623;
}

/* MAIN CONTAINER */
.container{
max-width:550px;
margin:50px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

/* PAGE TITLE */
.container h2{
text-align:center;
color:#1F5E87;
margin-bottom:30px;
}

/* OPTIONS */
.option{
display:block;
background:#f1f1f1;
padding:18px;
margin:15px 0;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.option:hover{
background:#e3e3e3;
transform:translateY(-2px);
}

/* RADIO BUTTON */
input[type="radio"]{
margin-right:12px;
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:16px;
margin-top:25px;
background:#F5A623;
color:white;
border:none;
font-size:18px;
font-weight:600;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#d98d11;
}

/* FOOTER */
footer{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>

<h1>Milly John's Burgers</h1>

</header>

<!-- NAVIGATION -->
<nav>

<a href="index.html">Home</a>

<a href="menu.html">Menu</a>

<a href="contact.html">Contact Us</a>

<a href="about.html">About Us</a>

<a href="enquiries.html">Enquiries</a>

</nav>

<!-- MAIN CONTENT -->
<main>

<div class="container">

<h2>Chocolate Milkshake</h2>

<form action="checkout.html"
method="GET">

<!-- OPTION 1 -->
<label class="option">

<input type="radio"
name="order"
value="Small Chocolate Milkshake - R18.00"
required>

Small Chocolate Milkshake - R18.00

</label>

<!-- OPTION 2 -->
<label class="option">

<input type="radio"
name="order"
value="Medium Chocolate Milkshake - R28.00">

Medium Chocolate Milkshake - R28.00

</label>

<!-- OPTION 3 -->
<label class="option">

<input type="radio"
name="order"
value="Large Chocolate Milkshake - R34.90">

Large Chocolate Milkshake - R34.90

</label>

<!-- BUTTON -->
<button type="submit">

Add To Cart & Checkout

</button>

</form>

</div>

</main>

<!-- FOOTER -->
<footer>

<p>
&copy; 2026 Milly John's Burgers |
All Rights Reserved
</p>

</footer>

<script src="js_assets/script.js"></script>

</body>

</html>
