<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Explore Milly John's delicious hot drinks including latte, coffee, cappuccino and hot chocolate.">

<title>Hot Drinks | Milly John's Burgers</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

/* BODY */
body{
margin:0;
font-family:Montserrat,sans-serif;
background:#f4f7fb;
color:#333;
}

/* CONTAINER */
.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* HEADER */
header{
background:white;
padding:25px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

header h1{
color:#F5A623;
margin:0;
font-size:40px;
}

/* NAVIGATION */
nav{
background:#1F5E87;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:15px;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

nav a:hover{
color:#F5A623;
}

/* CATALOGUE SECTION */
.catalogue{
padding:50px 20px;
text-align:center;
}

.catalogue h2{
font-size:36px;
color:#1F5E87;
margin-bottom:10px;
}

.catalogue p{
font-size:18px;
margin-bottom:40px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:30px;
}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
transition:0.3s ease;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
}

.card h3{
color:#1F5E87;
margin-top:15px;
}

/* ORDER BUTTON */
.order-btn{
display:inline-block;
margin-top:10px;
padding:12px 24px;
background:#F5A623;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:600;
transition:0.3s;
}

.order-btn:hover{
background:#d98d11;
}

/* FOOTER */
footer{
background:#1F5E87;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>

<div class="container">

<h1>Milly John's Burgers</h1>

</div>

</header>

<!-- NAVIGATION -->
<nav>

<a href="index.html">Home</a>

<a href="menu.html">Menu</a>

<a href="contact.html">Contact Us</a>

<a href="about.html">About Us</a>

<a href="enquiries.html">Enquiries</a>

</nav>

<!-- MAIN CONTENT -->
<main>

<section class="catalogue">

<div class="container">

<h2>Hot Drinks Catalogue</h2>

<p>
Warm up with our delicious range of freshly prepared hot drinks.
</p>

<div class="grid">

<!-- LATTE -->
<div class="card">

<img src="images/latte.jpg"
alt="Latte"
loading="lazy">

<h3>Latte</h3>

<a href="latte.html"
class="order-btn">
Order Now
</a>

</div>

<!-- COFFEE -->
<div class="card">

<img src="images/coffee.jpg"
alt="Coffee"
loading="lazy">

<h3>Coffee</h3>

<a href="coffee.html"
class="order-btn">
Order Now
</a>

</div>

<!-- CAPPUCCINO -->
<div class="card">

<img src="images/cappuccino.jpg"
alt="Cappuccino"
loading="lazy">

<h3>Cappuccino</h3>

<a href="cappuccino.html"
class="order-btn">
Order Now
</a>

</div>

<!-- HOT CHOCOLATE -->
<div class="card">

<img src="images/hot-chocolate.jpg"
alt="Hot Chocolate"
loading="lazy">

<h3>Hot Chocolate</h3>

<a href="hot-chocolate.html"
class="order-btn">
Order Now
</a>

</div>

</div>

</div>

</section>

</main>

<!-- FOOTER -->
<footer>

<p>
&copy; 2026 Milly John's Burgers |
All Rights Reserved
</p>

</footer>

<script src="js_assets/script.js"></script>

</body>

</html>
